conluz.time.zone.id=Europe/Madrid
conluz.i18n.locale.default=es

conluz.security.jwt.secret-key=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

# InfluxDB configuration
spring.influxdb.url=http://localhost:8086
spring.influxdb.username=luz
spring.influxdb.password=blank
spring.influxdb.database=conluz_db_test

# Database configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/conluz_db_test
spring.datasource.username=luz
spring.datasource.password=blank
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Liquibase configuration
spring.liquibase.drop-first=true

# Enable Hibernate SQL logging
spring.jpa.show-sql=false

# Format the SQL logged by Hibernate
spring.jpa.properties.hibernate.format_sql=false

# Enables SessionFactory.getStatistics() (query-count assertions in tests, e.g. N+1 regression
# checks). Negligible overhead -- just counter increments -- so it is safe to enable suite-wide
# rather than scoping it to one test class, which would otherwise spin up a second Spring context
# and a second Hikari pool, risking Postgres's connection limit under the full suite.
spring.jpa.properties.hibernate.generate_statistics=true

# Set the logging level for Hibernatelogging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=INFO
