conluz.time.zone.id=Europe/Madrid
conluz.i18n.locale.default=es

conluz.security.jwt.secret-key=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

# InfluxDB configuration
spring.influxdb.url=http://localhost:8086
spring.influxdb.username=luz
spring.influxdb.password=blank
spring.influxdb.database=conluz_db_test

# Database configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/conluz_db_test
spring.datasource.username=luz
spring.datasource.password=blank
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Connections to the test database. Every distinct Spring test context is cached for the whole run and holds
# its own connection pool, all of them to the one PostgreSQL container in BaseIntegrationTest. A test class with
# a different configuration (its own properties, @MockitoBean, @MockitoSpyBean) is a distinct context; the run
# has about 25. When the pools together ask for more than the container allows, the next context fails to start
# with "too many clients already", in whichever test class happens to come next, not in the one that added it.
#
# - maximum-pool-size is bounded by the largest concurrent test: the races run two threads that each hold one
#   transaction while the test thread waits, so 2 connections at most, plus a margin of 2.
# - minimum-idle keeps an idle cached context down to one connection; it grows to the maximum only while a
#   concurrent test needs it.
# - connection-timeout makes a test that cannot get a connection fail within seconds with Hikari's own error,
#   instead of waiting 30 seconds.
# - The container's max_connections (BaseIntegrationTest) is sized for twice today's contexts at the full pool
#   size: 2 x 25 x 4 = 200, plus margin, so 250.
#
# A new test configuration should still reuse an existing base class where it can: every context costs startup
# time and heap (the test JVM's maxHeapSize in build.gradle) as well as connections.
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=5000

# Scheduled jobs do not run in tests: a job firing on the scheduler's thread mid-test races with what
# the test measures or asserts (e.g. the Hibernate statistics below, which are application-wide). Jobs
# are tested by calling them directly.
conluz.scheduling.enabled=false

# No email leaves the application in tests. The tests that send switch it on against an embedded SMTP server.
conluz.mail.enabled=false

# Liquibase configuration
spring.liquibase.drop-first=true

# Enable Hibernate SQL logging
spring.jpa.show-sql=false

# Format the SQL logged by Hibernate
spring.jpa.properties.hibernate.format_sql=false

# Enables SessionFactory.getStatistics() (query-count assertions in tests, e.g. N+1 regression
# checks). Negligible overhead -- just counter increments -- so it is safe to enable suite-wide
# rather than scoping it to one test class, which would otherwise spin up a second Spring context
# and a second Hikari pool, risking Postgres's connection limit under the full suite.
spring.jpa.properties.hibernate.generate_statistics=true

# Set the logging level for Hibernatelogging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=INFO

# Supply tariff estimation
conluz.supply.tariff.estimated.base-eur-per-kwh=0.15
conluz.supply.tariff.estimated.vat-rate=0
