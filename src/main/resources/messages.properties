email.platform-admin-invitation.body=Hello,\n\nYou have been invited to become a platform admin of Conluz.\n\nTo accept the invitation, open this link:\n{0}\n\nWhen you accept, you will be asked for a confirmation code. Whoever invited you will give it to you, by phone or in person: it is never sent by email.\n\nThe link is valid for 7 days and can only be used once.\n\nIf you did not expect this message, you can ignore it.
