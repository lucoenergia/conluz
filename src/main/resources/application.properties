# Multi-community feature flag
conluz.multi-community.enabled=true

# ConLuz global configuration
conluz.time.zone.id=Europe/Madrid
conluz.i18n.locale.default=es

# 10080 = 1 week
conluz.security.jwt.expiration-time=10080
# Used only for testing
conluz.security.jwt.secret-key=

# InfluxDB configuration
spring.influxdb.url=http://localhost:8086
spring.influxdb.username=luz
spring.influxdb.password=blank
spring.influxdb.database=conluz_db

# Database configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/conluz_db
spring.datasource.username=luz
spring.datasource.password=blank
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Liquibase configuration
spring.liquibase.change-log=classpath:db/liquibase/db.changelog-main.xml
spring.liquibase.drop-first=false

#Encoding
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# Spring profile
spring.profiles.active=production

# Serialization / Deserialization
spring.jackson.deserialization.fail-on-unknown-properties=true

# Open API docs
springdoc.cache.disabled=false
springdoc.packages-to-scan=org.lucoenergia.conluz.infrastructure
springdoc.auto-tag-classes=false
springdoc.remove-broken-reference-definitions=false
# Set false to avoid populate on all components schemas with example null "example = null"
springdoc.writer-with-order-by-keys=false

springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/api-docs/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.disable-swagger-default-url=true

springdoc.api-docs.enabled=true
springdoc.api-docs.path=/api-docs
springdoc.api-docs.resolve-schema-properties=true

# Max file and request size
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# Actuator
management.endpoints.web.exposure.include=health,info,loggers
# An unreachable SMTP server must never mark the application down
management.health.mail.enabled=false

## SSL configuration
server.port=8443
server.ssl.enabled=false
# The format used for the keystore. It could be set to JKS in case it is a JKS file
server.ssl.key-store-type=PKCS12
# The path to the keystore containing the certificate
server.ssl.key-store=classpath:keystore/conluz.p12
# The password used to generate the certificate
server.ssl.key-store-password=changeit
# The alias mapped to the certificate
server.ssl.key-alias=conluz

## Client address behind a reverse proxy
# X-Forwarded-For is honoured only when the direct peer matches CONLUZ_TRUSTED_PROXIES, a Java regex over the
# peer's IP address. Unset or empty trusts no address, which overrides Tomcat's default of trusting every private
# range: otherwise any client on a private network could choose the address it is throttled and logged under.
server.forward-headers-strategy=native
server.tomcat.remoteip.internal-proxies=${CONLUZ_TRUSTED_PROXIES:}

## Supply tariff estimation
conluz.supply.tariff.estimated.base-eur-per-kwh=0.15
conluz.supply.tariff.estimated.vat-rate=0

# CORS configuration
# We can specify a list of origins separated by comas. Example: http://localhost:3000,http://localhost:4000,http://localhost:5000
conluz.allowed.origins=http://localhost:3001

## Email sending
# Off unless CONLUZ_MAIL_ENABLED is true: no SMTP connection is ever opened, and each email is only noted in the log.
# Switched on with a missing host or sender address, the application still starts, warns once, and every email fails.
# The spring.mail.* settings are not used, so that Spring Boot's own mail configuration stays inactive.
conluz.mail.enabled=${CONLUZ_MAIL_ENABLED:false}
conluz.mail.host=${CONLUZ_MAIL_HOST:}
conluz.mail.port=${CONLUZ_MAIL_PORT:587}
conluz.mail.username=${CONLUZ_MAIL_USERNAME:}
conluz.mail.password=${CONLUZ_MAIL_PASSWORD:}
conluz.mail.from-address=${CONLUZ_MAIL_FROM_ADDRESS:}
conluz.mail.from-name=${CONLUZ_MAIL_FROM_NAME:}
conluz.mail.starttls=${CONLUZ_MAIL_STARTTLS:true}

## Public web client
# The address members open the web client at, without a trailing slash; password reset links point to it. Unset or
# invalid, no password reset email is sent, and the application warns once at startup if email sending is enabled.
conluz.web.public-url=${CONLUZ_PUBLIC_WEB_URL:}
