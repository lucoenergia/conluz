# Dependency graph submission and review
#
# GitHub does not parse Gradle manifests, so the repository's dependency graph only contains the Gradle
# dependencies that a workflow submits through the Dependency Submission API. Both Dependabot alerts and
# dependency review read that graph: without this workflow, neither of them sees any Java dependency.
#
# The graph is submitted on every push to main (the base that pull requests are compared against) and for
# the head of every pull request. Both submissions come from the same job of the same workflow on purpose:
# the snapshot's job correlator is derived from the workflow name and job id, and dependency review only
# compares snapshots that share a correlator. Renaming this workflow or the submission job resets that.
#
# Submitting needs `contents: write`, which GITHUB_TOKEN never gets on pull requests from forks, so the
# submission job fails there. The check is therefore intentionally not required (#475).
#
# Dependency review waits for the head submission, so it never compares against a graph that is not there
# yet; if the submission fails, the review is skipped rather than passed. It still retries while GitHub
# reports snapshot warnings, but the action has no option to fail once the retry times out: if the base
# commit has no snapshot (for example before the first submission on main), or processing outlasts the
# timeout, the review proceeds and only shows the warning in the job summary (#475).
name: 'Dependency Review'
on:
  push:
    branches: [ main ]
  pull_request:

permissions: {}

jobs:
  dependency-submission:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@v7
      - name: 'Set up JDK 17'
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'zulu'
      - name: 'Submit Gradle dependency graph'
        uses: gradle/actions/dependency-submission@v6
        env:
          # Scopes only what ships as runtime, so dependency review (which fails on runtime scope by
          # default) is not blocked by test-only dependencies. Nothing is excluded from the graph:
          # every other configuration is still submitted, as development, and stays visible to
          # Dependabot alerts.
          DEPENDENCY_GRAPH_RUNTIME_INCLUDE_CONFIGURATIONS: '^(runtimeClasspath|compileClasspath)$'

  dependency-review:
    if: github.event_name == 'pull_request'
    needs: dependency-submission
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 'Dependency Review'
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 300
