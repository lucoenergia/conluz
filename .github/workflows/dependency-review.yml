# Dependency graph submission and review
#
# GitHub does not parse Gradle manifests, so the repository's dependency graph only contains the Gradle
# dependencies that a workflow submits through the Dependency Submission API. Both Dependabot alerts and
# dependency review read that graph: without this workflow, neither of them sees any Java dependency.
#
# The graph is submitted on every push to main (the base that pull requests are compared against) and for
# the head of every pull request. Both submissions come from the same job of the same workflow on purpose.
#
# Do not rename this workflow's `name:` or the `dependency-submission` job id. Together they form the Gradle
# dependency-graph job correlator, and the base (push to main) and head (pull request) snapshots must share
# it. Renaming either makes dependency review treat the whole tree as added on every pull request until a
# new base snapshot exists.
#
# Submitting needs `contents: write`, which GITHUB_TOKEN never gets on pull requests from forks, so the
# submission job fails there. The check is therefore intentionally not required (#475).
#
# Dependency review waits for the head submission; if the submission fails, the review is skipped rather
# than passed. It retries while GitHub reports snapshot warnings, but the action has no option to fail once
# the retry times out. If the head snapshot is still not processed by then, the head appears to have no
# Gradle dependencies, the diff holds only removals, and the review passes with just a warning in the job
# summary (#475). A missing base snapshot is not a silent pass: the whole head tree counts as added and is
# evaluated, so pre-existing advisories block.
name: 'Dependency Review'
on:
  push:
    branches: [ main ]
  pull_request:

permissions: {}

jobs:
  dependency-submission:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@v7
      - name: 'Set up JDK 17'
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'zulu'
      - name: 'Submit Gradle dependency graph'
        uses: gradle/actions/dependency-submission@v6
        env:
          # Scopes only what ships as runtime, so dependency review (which fails on runtime scope by
          # default) is not blocked by test-only dependencies. Nothing is excluded from the graph:
          # every other configuration is still submitted, as development, and stays visible to
          # Dependabot alerts.
          DEPENDENCY_GRAPH_RUNTIME_INCLUDE_CONFIGURATIONS: '^(runtimeClasspath|compileClasspath)$'

  dependency-review:
    if: github.event_name == 'pull_request'
    needs: dependency-submission
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 'Dependency Review'
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 300
