# Builds and publishes the Conluz Docker image to GitHub Container Registry (GHCR).
#
# How it fits in:
#   1. A push to `main` triggers `version-update.yml`, which bumps the patch
#      version in build.gradle and pushes a tag like `1.0.76` using a PAT
#      (secrets.ACTIONS_CONLUZ). The PAT matters: tags pushed with the default
#      GITHUB_TOKEN do NOT trigger downstream workflows, so this one would not
#      fire if version-update.yml ever switches to GITHUB_TOKEN.
#   2. That tag push triggers this workflow, which checks out the tagged
#      commit, builds the JAR and the image, scans the image with Trivy, and
#      publishes it to GHCR only if the scan gate passes (#476, policy in #474).
#
# Resulting tags published per release (for tag `1.0.76`):
#   ghcr.io/lucoenergia/conluz:1.0.76
#   ghcr.io/lucoenergia/conluz:1.0
#   ghcr.io/lucoenergia/conluz:1
#   ghcr.io/lucoenergia/conluz:latest
#
# Reference: https://docs.github.com/en/packages/working-with-a-github-packages-registry/working-with-the-container-registry

name: Build and push Docker image

on:
  push:
    # Trigger only on version tags (e.g. `1.0.76`) created by version-update.yml.
    # Tags use no `v` prefix to match the version literal stored in build.gradle.
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  # Also triggered explicitly by version-update.yml via `gh workflow run`, because
  # tags pushed with GITHUB_TOKEN do not fire push events for downstream workflows.
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # github.repository is `<owner>/<repo>` (e.g. `lucoenergia/conluz`),
  # which is the canonical image name for GHCR.
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # `packages: write` is what allows the built-in GITHUB_TOKEN to push to GHCR.
    # Without it, the docker/login-action step would still succeed but the
    # final push would fail with `denied: installation not allowed to ...`.
    # `security-events: write` lets the job upload the scan results (SARIF) to
    # code scanning.
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      # Checks out the repo at the pushed tag's commit, so the JAR built below
      # contains the version that matches the tag. fetch-depth: 0 pulls full
      # history/tags, which build.gradle needs at build time to resolve the
      # exact tag via `git describe --tags`.
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # JDK 17 matches the project's toolchain (see build.gradle).
      # `cache: gradle` reuses ~/.gradle/caches across runs to speed up builds.
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: 'gradle'

      # The `gradlew` script may lose its executable bit when checked out on
      # some runners; make sure it can be invoked.
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Produces build/libs/conluz-<version>.jar, which the root Dockerfile
      # copies in via `ARG JAR_FILE=build/libs/conluz-*.jar`. `gradle build`
      # also runs the full test suite (JUnit 5 + Testcontainers), so a failing
      # test will block the image from being published.
      - name: Build JAR with Gradle (runs tests)
        run: ./gradlew clean build --info

      # Buildx enables BuildKit features (multi-stage cache, multi-platform).
      # We only build linux/amd64 today, but Buildx is a prerequisite for the
      # GitHub Actions cache backend (`type=gha`) configured below.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Authenticates against ghcr.io using the workflow's ephemeral
      # GITHUB_TOKEN — no PAT or repository secret required for publishing.
      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Generates the list of image tags + OCI labels from the git ref.
      # For tag `1.0.76`, the four `tags:` lines below produce:
      #   1.0.76, 1.0, 1, latest
      # If you only want `<version>` + `latest`, drop the two intermediate
      # semver patterns.
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      # Builds the image from the root Dockerfile (which expects a pre-built
      # JAR at build/libs/conluz-*.jar) into the runner's local Docker image
      # store, without pushing it. The steps below scan this local image and
      # push it only if the scan gate passes, so the published image is the
      # one that was scanned (#476).
      # `conluz-scan:<sha>` is a local-only tag that both scans use, so they
      # always target this build; it is never pushed.
      # `cache-from`/`cache-to: type=gha` reuses the BuildKit layer cache
      # across runs via GitHub's Actions cache, avoiding full rebuilds.
      # An image loaded into the local store carries no build attestation, so
      # the published image has no BuildKit provenance attestation.
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: |
            ${{ steps.meta.outputs.tags }}
            conluz-scan:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Every accepted finding must have an expiry and a reason (policy in #474):
      # fail on any entry that lacks `exp:YYYY-MM-DD` or a `# reason`.
      - name: Lint .trivyignore
        run: |
          bad=$(grep -nvE '^[[:space:]]*(#|$)' .trivyignore | grep -vE 'exp:[0-9]{4}-[0-9]{2}-[0-9]{2}([[:space:]].*)?#[[:space:]]*[^[:space:]]' || true)
          if [ -n "$bad" ]; then
            echo "::error file=.trivyignore::every entry needs exp:YYYY-MM-DD and a # reason"
            echo "$bad"
            exit 1
          fi

      # Report scan: CRITICAL and HIGH vulnerabilities with a fix available, in
      # OS packages and in the libraries inside the JAR, written as SARIF for
      # code scanning. It never fails the job; the gate below does.
      # `limit-severities-for-sarif` is needed for `severity` to apply to SARIF.
      # The action caches the vulnerability database between runs. If the
      # database cannot be downloaded, the scan fails and nothing is pushed.
      - name: Scan image (report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.0
          image-ref: conluz-scan:${{ github.sha }}
          scanners: vuln
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          ignore-unfixed: true
          trivyignores: .trivyignore
          format: sarif
          output: trivy-results.sarif
          exit-code: 0

      # Uploads the report even when a later step fails, under one stable
      # category so each run replaces the previous image results.
      - name: Upload scan results to code scanning
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: container-image

      # Gate (policy in #474): fail on any CRITICAL vulnerability with a fix
      # available that `.trivyignore` does not accept. A failure here stops the
      # job before the push.
      - name: Scan image (gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.0
          image-ref: conluz-scan:${{ github.sha }}
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          format: table
          exit-code: 1

      # Pushes the scanned local image under every tag produced by the metadata
      # step (never the local-only scan tag), and shows that each pushed tag is
      # the scanned image. It prints the scanned image's ID and its config
      # digest, read from `docker save` because the image ID is the config
      # digest only with the classic image store (with the containerd store it
      # is the manifest list's digest). It then compares that config digest
      # with the one of each pushed tag and fails the run if they differ.
      - name: Push Docker image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          SCAN_REF: conluz-scan:${{ github.sha }}
        run: |
          echo "Scanned image ID: $(docker image inspect --format '{{.Id}}' "$SCAN_REF")"
          scanned=$(docker save "$SCAN_REF" | tar -xO manifest.json | jq -r '.[0].Config | sub("^blobs/sha256/"; "sha256:")')
          echo "Scanned image config digest: $scanned"
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker push "$tag"
            manifest=$(docker buildx imagetools inspect --raw "$tag")
            if jq -e '.manifests' <<<"$manifest" >/dev/null; then
              digest=$(jq -r '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest' <<<"$manifest")
              manifest=$(docker buildx imagetools inspect --raw "${tag%:*}@$digest")
            fi
            pushed=$(jq -r '.config.digest' <<<"$manifest")
            echo "Pushed $tag, config digest: $pushed"
            if [ "$pushed" != "$scanned" ]; then
              echo "::error::$tag config digest $pushed differs from the scanned image's $scanned"
              exit 1
            fi
          done <<<"$TAGS"
