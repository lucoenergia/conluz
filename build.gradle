plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'org.lucoenergia'

// Version is derived from the nearest git tag reachable from HEAD (created by
// .github/workflows/version-update.yml), not hardcoded here. This lets the
// version-bump workflow push a tag without ever committing to `main`, so it
// is unaffected by branch protection rules on `main`.
def versionOutput = providers.exec {
    commandLine 'git', 'describe', '--tags', '--abbrev=0'
    ignoreExitValue = true
}.standardOutput.asText.getOrElse('').trim()

version = versionOutput ?: '0.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

// Spring Boot 3.5 is out of OSS support and its managed Tomcat lacks the fixes for critical CVEs (#487).
// Remove this override once Spring Boot manages Tomcat 10.1.61 or newer, at the latest when migrating
// to Spring Boot 4.
ext['tomcat.version'] = '10.1.61'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    implementation 'org.liquibase:liquibase-core:4.28.0'
    implementation 'org.influxdb:influxdb-java:2.25'
    // implementation, not runtimeOnly: PostgresConstraintName reads PSQLException's structured
    // ServerErrorMessage to identify a constraint violation by name, so the driver's exception
    // type must be visible at compile time in main sources, not just on the runtime classpath.
    implementation 'org.postgresql:postgresql'

    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.8'

    implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
    implementation "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
    implementation "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"

    implementation 'com.opencsv:opencsv:5.12.0'

    implementation "org.apache.commons:commons-compress:1.28.0"

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.testcontainers:influxdb'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.5.1'
    // Embedded SMTP server for the email sending tests. Its Jakarta Mail and Angus versions are the ones
    // Spring Boot manages. JUnit 4 is only needed for its JUnit 4 rule, which is not used.
    testImplementation('com.icegreen:greenmail:2.1.14') {
        exclude group: 'junit', module: 'junit'
    }
}

tasks.named('test') {
    useJUnitPlatform()
    // Every cached Spring test context stays in memory for the whole run; Gradle's default of 512m runs out
    // a couple of contexts past today's count (see application-test.properties).
    maxHeapSize = '1g'
    // Each fork starts its own PostgreSQL and InfluxDB containers and builds its own Spring contexts, so the
    // count is capped at half the CPUs and at four. Tests inside a fork still run one at a time: they share
    // state (committed data, Hibernate statistics, captured logs, the mutable clock) that rules out JUnit's
    // in-JVM parallel execution (#443).
    maxParallelForks = Math.max(1, Math.min(4, Runtime.runtime.availableProcessors().intdiv(2)))
    // Opt-in check that no test depends on the state another one leaves behind (#481): -PrandomTestOrder runs the
    // classes of each fork, and the methods of each class, in a random order, and -PrandomTestOrder=<seed> repeats an
    // order. The default order stays deterministic.
    if (project.hasProperty('randomTestOrder')) {
        def seed = project.property('randomTestOrder') ?: Long.toString(new Random().nextLong())
        logger.lifecycle("Running tests in a random order with seed ${seed}")
        systemProperty 'junit.jupiter.testclass.order.default', 'org.junit.jupiter.api.ClassOrderer$Random'
        systemProperty 'junit.jupiter.testmethod.order.default', 'org.junit.jupiter.api.MethodOrderer$Random'
        systemProperty 'junit.jupiter.execution.order.random.seed', seed
    }
    testLogging {
        events "failed", "skipped"
        exceptionFormat "full"
        showExceptions true
        showCauses true
        showStackTraces true
        showStandardStreams false
        // CI runs Gradle with --info, whose defaults also print every test's standard output
        info {
            events "failed", "skipped"
            exceptionFormat "full"
            showExceptions true
            showCauses true
            showStackTraces true
            showStandardStreams false
        }
    }
}

jar {
    // We only want to generate the executable jar (which includes dependencies), then we disable the Jar task
    enabled = false
}

springBoot {
    buildInfo()
}
