plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.4'
}

group = 'org.lucoenergia'

// Version is derived from the nearest git tag reachable from HEAD (created by
// .github/workflows/version-update.yml), not hardcoded here. This lets the
// version-bump workflow push a tag without ever committing to `main`, so it
// is unaffected by branch protection rules on `main`.
def versionOutput = providers.exec {
    commandLine 'git', 'describe', '--tags', '--abbrev=0'
    ignoreExitValue = true
}.standardOutput.asText.getOrElse('').trim()

version = versionOutput ?: '0.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-quartz'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    implementation 'org.liquibase:liquibase-core:4.28.0'
    implementation 'org.influxdb:influxdb-java:2.25'
    // implementation, not runtimeOnly: PostgresConstraintName reads PSQLException's structured
    // ServerErrorMessage to identify a constraint violation by name, so the driver's exception
    // type must be visible at compile time in main sources, not just on the runtime classpath.
    implementation 'org.postgresql:postgresql'

    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.8'

    implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
    implementation "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
    implementation "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"

    implementation 'com.opencsv:opencsv:5.9'

    implementation "org.apache.commons:commons-compress:1.26.0"
    implementation "org.apache.commons:commons-collections4:4.4"

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.testcontainers:influxdb'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.0'
    // Embedded SMTP server for the email sending tests. Its Jakarta Mail and Angus versions are the ones
    // Spring Boot manages. JUnit 4 is only needed for its JUnit 4 rule, which is not used.
    testImplementation('com.icegreen:greenmail:2.1.14') {
        exclude group: 'junit', module: 'junit'
    }
}

tasks.named('test') {
    useJUnitPlatform()
    // Every cached Spring test context stays in memory for the whole run; Gradle's default of 512m runs out
    // a couple of contexts past today's count (see application-test.properties).
    maxHeapSize = '1g'
    // Each fork starts its own PostgreSQL and InfluxDB containers and builds its own Spring contexts, so the
    // count is capped at half the CPUs and at four. Tests inside a fork still run one at a time: they share
    // state (committed data, Hibernate statistics, captured logs, the mutable clock) that rules out JUnit's
    // in-JVM parallel execution (#443).
    maxParallelForks = Math.max(1, Math.min(4, Runtime.runtime.availableProcessors().intdiv(2)))
    testLogging {
        events "failed", "skipped"
        exceptionFormat "full"
        showExceptions true
        showCauses true
        showStackTraces true
        showStandardStreams false
        // CI runs Gradle with --info, whose defaults also print every test's standard output
        info {
            events "failed", "skipped"
            exceptionFormat "full"
            showExceptions true
            showCauses true
            showStackTraces true
            showStandardStreams false
        }
    }
}

jar {
    // We only want to generate the executable jar (which includes dependencies), then we disable the Jar task
    enabled = false
}

springBoot {
    buildInfo()
}
